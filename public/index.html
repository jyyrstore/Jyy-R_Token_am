<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>JYY'R Token</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand">JYY'R TOKEN</div>
      <h1>Token Center</h1>
      <p>Dapatkan token yang sudah dipublish Owner. Token akan otomatis disalin setelah menekan GET TOKEN.</p>
    </header>

    <section class="toolbar" aria-label="Token Center status">
      <span id="sessionBadge" class="pill" aria-label="Status koneksi">Mengecek koneksi…</span>
      <button id="refreshBtn" class="btn secondary" type="button">Refresh</button>
    </section>

    <section id="status" class="status" aria-live="polite"></section>
    <section id="tokenList" class="token-list" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>Belum ada token yang tersedia saat ini.</div>
  </main>

  <div id="usernameModal" class="modal" hidden aria-hidden="true">
    <div class="backdrop"></div>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="usernameTitle">
      <button id="closeUsername" class="icon" type="button" aria-label="Tutup">×</button>
      <span class="eyebrow">JYY'R AMPREM</span>
      <h2 id="usernameTitle">Buat Username</h2>
      <p>Username ini hanya menjadi prefill saat Anda masuk ke halaman Register Amprem.</p>
      <label for="usernameInput">Username</label>
      <input id="usernameInput" maxlength="30" autocomplete="username" placeholder="@jyyyr">
      <div id="usernameStatus" class="inline-status" aria-live="polite"></div>
      <button id="continueRegister" class="btn primary full" type="button">Lanjut Daftar</button>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
